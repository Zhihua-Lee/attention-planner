name: Verified lifecycle implementation
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/lifecycle-apply.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/lifecycle-ux-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply verified regression fixes and remove temporary workbench
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/lifecycle-ux-20260917 | cut -f1)" = "$EXPECTED_HEAD"
          echo '2a5c2b2746e9d176d86bd017db587e889110ad29e9d40b5745e7baca68e9e86f  .lifecycle-followup.patch' | sha256sum -c -
          git apply --check --index .lifecycle-followup.patch
          git apply --index .lifecycle-followup.patch
          git rm .lifecycle-followup.patch .github/workflows/lifecycle-apply.yml .github/workflows/lifecycle-workbench.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: verify recurrence drafts and unified task navigation'
          git push origin HEAD:feat/lifecycle-ux-20260917
          echo "Published source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Cross-platform TypeScript and schema contracts
        run: bun run typecheck && bun run schema:check
      - name: Remove unrelated Microsoft apt feeds
        run: |
          mapfile -t sources < <(grep -rl 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          for source in "${sources[@]}"; do sudo mv "$source" "$source.disabled"; done
      - run: bunx playwright install --with-deps chromium
      - name: Real-browser lifecycle regression
        run: bun run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: lifecycle-browser-verification
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3
