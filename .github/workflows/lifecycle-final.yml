name: Lifecycle final verification
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/lifecycle-final.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/lifecycle-ux-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply checked corrections and remove temporary workflow
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/lifecycle-ux-20260917 | cut -f1)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 0ee40a1d2000bed7a69a1c287d87c709b65809eb HEAD
          python3 - <<'PY'
          import base64, zlib, hashlib, pathlib, os
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c7008e94879e80640c6c2191ca5faf2369f0d0cb3c35ca370e0523922f66342e'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'final.patch').write_bytes(patch)
          PY
          git apply --check --index --unidiff-zero "$RUNNER_TEMP/final.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/final.patch"
          git rm .github/workflows/lifecycle-final.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete lifecycle regression and reduce feedback noise'
          git push origin HEAD:feat/lifecycle-ux-20260917
          echo "Published and tested source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Cross-platform contracts including browser-test types
        run: bun run typecheck && bun run typecheck:e2e && bun run schema:check
      - name: Remove unrelated Microsoft apt feeds
        run: |
          mapfile -t sources < <(grep -rl 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          for source in "${sources[@]}"; do sudo mv "$source" "$source.disabled"; done
      - run: bunx playwright install --with-deps chromium
      - name: Real-browser lifecycle regression
        run: bun run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: lifecycle-final-browser-verification
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3
